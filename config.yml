---
- hosts: all
  become: true
  pre_tasks:
  - name: Ensure EPEL repository is installed
    ansible.builtin.dnf:
        name: epel-release
        state: present

  - name: Install snapd
    ansible.builtin.dnf:
        name: snapd
        state: present

  - name: Enable and start snapd socket
    ansible.builtin.systemd:
        name: snapd.socket
        enabled: yes
        state: started

  - name: Enable classic snap support (create symlink)
    ansible.builtin.file:
        src: /var/lib/snapd/snap
        dest: /snap
        state: link
        
  - name: update repository index (CentOS)
    tags: always
    yum:
      update_cache: yes
    changed_when: false
    when: ansible_distribution == "CentOS"

  - name: update repository index (Ubuntu)
    tags: always
    apt:
      update_cache: yes
    changed_when: false
    when: ansible_distribution == "Ubuntu"

  - name: motd player
    copy: 
        content: "Ansible Managed by Dazon\n"
        dest: /etc/motd

- hosts: all
  become: true
  roles:
      - prometheus
      - apache2
